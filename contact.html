<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Solomon Emmanuel</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark py-3" aria-label="Main navigation">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                <span class="brand-symbol" aria-hidden="true"></span>
                
            </a>

            <div class="portfolio-nav">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="projects.html">Projects</a>
                <a href="contact.html" aria-current="page">Contact</a>
            </div>

        </div>
    </nav>


    <!-- Contact Header -->
    <section class="page-header">

        <div class="container text-center">

            <h1 class="display-4 fw-bold text-white">
                Contact Me
            </h1>

            <p class="text-light">
                Have a question or want to work together? Feel free to reach out.
            </p>

        </div>

    </section>


    <!-- Contact Section -->
    <section class="py-5">

        <div class="container">

            <div class="row g-5">


                <!-- Contact Information -->
                <div class="col-lg-5">

                    <h2 class="fw-bold mb-4">
                        Let's Connect
                    </h2>

                    <div class="contact-info">

                        <div class="contact-item">

                            <div class="contact-icon">
                                @
                            </div>

                            <div>
                                <h5>Email</h5>
                                <p class="text-muted">
                                    <a href="mailto:Solomonokiki05@gmail.com">Solomonokiki05@gmail.com</a>
                                </p>
                            </div>

                        </div>


                        <div class="contact-item">

                            <div class="contact-icon">
                                #
                            </div>

                            <div>
                                <h5>Phone</h5>
                                <p class="text-muted"><a href="tel:+2347010053072">07010053072</a></p>
                            </div>

                        </div>


                        <div class="contact-item">

                            <div class="contact-icon">
                                &lt;&gt;
                            </div>

                            <div>
                                <h5>Field</h5>
                                <p class="text-muted">
                                    Information Technology
                                </p>
                            </div>

                        </div>

                    </div>

                </div>


                <!-- Contact Form -->
                <div class="col-lg-7">

                    <div class="contact-form">

                        <h3 class="fw-bold mb-4">
                            Send Me a Message
                        </h3>

                        <form action="mailto:Solomonokiki05@gmail.com" method="post" enctype="text/plain">

                            <!-- Name -->
                            <div class="mb-3">

                                <label for="name"
                                       class="form-label">
                                    Full Name
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="name"
                                       name="name"
                                       placeholder="Enter your name"
                                       autocomplete="name"
                                       required>

                            </div>


                            <!-- Email -->
                            <div class="mb-3">

                                <label for="email"
                                       class="form-label">
                                    Email Address
                                </label>

                                <input type="email"
                                       class="form-control"
                                       id="email"
                                       name="email"
                                       placeholder="Enter your email"
                                       autocomplete="email"
                                       required>

                            </div>


                            <!-- Subject -->
                            <div class="mb-3">

                                <label for="subject"
                                       class="form-label">
                                    Subject
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="subject"
                                       name="subject"
                                       placeholder="Enter subject"
                                       required>

                            </div>


                            <!-- Message -->
                            <div class="mb-4">

                                <label for="message"
                                       class="form-label">
                                    Message
                                </label>

                                <textarea class="form-control"
                                          id="message"
                                          name="message"
                                          rows="5"
                                          placeholder="Write your message"
                                          required></textarea>

                            </div>


                            <button type="submit"
                                    class="btn btn-primary btn-lg">
                                Send Message
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer class="footer">

        <div class="container text-center">

            <p class="mb-0">
                © 2026 Solomon Emmanuel. All Rights Reserved.
            </p>

        </div>

    </footer>

</body>

</html>
